name: Build SB CPU Floating

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install packages
      run: |
        sudo apt update
        sudo apt install -y git curl xz-utils make perl clang


    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos


    - name: Install iPhone toolchain
      run: |
        mkdir -p $HOME/theos/toolchain/linux/iphone

        curl -L https://github.com/theos/sdks/releases/download/master/iphone-clang-linux.tar.xz \
        -o clang.tar.xz

        tar xf clang.tar.xz \
        -C $HOME/theos/toolchain/linux/iphone


    - name: Install SDK
      run: |
        git clone https://github.com/theos/sdks.git $HOME/theos/sdks


    - name: Build
      run: |
        export THEOS=$HOME/theos
        make clean || true
        make package FINALPACKAGE=1


    - name: Upload deb
      uses: actions/upload-artifact@v4
      with:
        name: SB-CPU-Floating
        path: packages/*.deb
