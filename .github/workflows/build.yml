name: Build SB CPU Floating

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout source
      uses: actions/checkout@v4


    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git \
          curl \
          make \
          clang \
          perl \
          xz-utils \
          python3


    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos


    - name: Setup Theos environment
      run: |
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV

        mkdir -p $HOME/theos/toolchain/linux/iphone/bin

        ln -sf $(which clang) \
        $HOME/theos/toolchain/linux/iphone/bin/clang

        ln -sf $(which clang++) \
        $HOME/theos/toolchain/linux/iphone/bin/clang++


    - name: Install iOS SDK
      run: |
        git clone https://github.com/theos/sdks.git /tmp/sdks

        mkdir -p $HOME/theos/sdks

        cp -r /tmp/sdks/*.sdk \
        $HOME/theos/sdks/ || true


    - name: Check environment
      run: |
        echo $THEOS
        ls $THEOS
        ls $THEOS/sdks || true


    - name: Build tweak
      run: |
        make clean || true
        make package FINALPACKAGE=1


    - name: Upload deb
      uses: actions/upload-artifact@v4

      with:
        name: SB-CPU-Floating-deb

        path: packages/*.deb
