name: Build SB CPU Floating

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Install build tools
        shell: bash
        run: |
          set -e

          brew update

          brew install make dpkg ldid xz

          echo "===== Tools ====="
          clang --version
          make --version
          ldid -V || true
          dpkg --version


      - name: Install RootHide Theos
        shell: bash
        run: |
          set -e

          export THEOS="$GITHUB_WORKSPACE/theos"

          rm -rf "$THEOS"

          git clone --recursive \
            https://github.com/roothide/theos.git \
            "$THEOS"

          echo "===== RootHide Theos installed ====="

          ls -lah "$THEOS"

          echo "===== Theos bin ====="

          ls -lah "$THEOS/bin" | head -40

          echo "===== Theos SDK directory ====="

          mkdir -p "$THEOS/sdks"

          echo "Theos clone OK"


      - name: Install iPhoneOS SDK
        shell: bash
        run: |
          set -e

          export THEOS="$GITHUB_WORKSPACE/theos"

          mkdir -p "$THEOS/sdks"

          echo "===== Download iPhoneOS 16.5 SDK ====="

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz" \
            -o /tmp/iPhoneOS16.5.sdk.tar.xz

          echo "===== SDK archive ====="

          ls -lh /tmp/iPhoneOS16.5.sdk.tar.xz

          file /tmp/iPhoneOS16.5.sdk.tar.xz

          echo "===== Extract SDK ====="

          tar -xJf \
            /tmp/iPhoneOS16.5.sdk.tar.xz \
            -C "$THEOS/sdks"

          echo "===== Installed SDKs ====="

          find "$THEOS/sdks" \
            -maxdepth 1 \
            -type d \
            -name "*.sdk" \
            -print

          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "iPhoneOS16.5 SDK OK"


      - name: Check Theos and SDK
        shell: bash
        run: |
          set -e

          export THEOS="$GITHUB_WORKSPACE/theos"

          echo "===== THEOS ====="
          echo "$THEOS"

          echo "===== SDK ====="
          ls -lah "$THEOS/sdks"

          echo "===== iPhoneOS16.5.sdk ====="
          ls -lah "$THEOS/sdks/iPhoneOS16.5.sdk" | head -30

          echo "===== Required Theos directories ====="

          test -d "$THEOS/bin"
          test -d "$THEOS/makefiles"
          test -d "$THEOS/toolchain"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "Theos + SDK OK"


      - name: Check source files
        shell: bash
        run: |
          set -e

          echo "===== Repository ====="

          find . \
            -maxdepth 3 \
            -type f \
            -not -path "./.git/*" \
            -print

          echo "===== Makefile ====="

          cat Makefile

          echo "===== Source ====="

          find . \
            -maxdepth 3 \
            \( -name "*.xm" -o -name "*.mm" -o -name "*.m" \) \
            -print


      - name: Build RootHide deb
        shell: bash
        run: |
          set -e

          export THEOS="$GITHUB_WORKSPACE/theos"

          echo "===== Build ====="

          echo "THEOS=$THEOS"

          make clean || true

          make package \
            THEOS_PACKAGE_SCHEME=roothide \
            FINALPACKAGE=1 \
            ARCHS=arm64e \
            SDKVERSION=16.5


      - name: Check package
        shell: bash
        run: |
          set -e

          echo "===== packages ====="

          ls -lah packages

          echo "===== file ====="

          file packages/*.deb

          echo "===== package information ====="

          dpkg-deb -I packages/*.deb

          echo "===== package contents ====="

          dpkg-deb -c packages/*.deb


      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: SB-CPU-Floating-deb
          path: packages/*.deb
          if-no-files-found: error
