name: Build SB CPU Floating

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          git \
          make \
          clang \
          curl \
          xz-utils \
          python3 \
          perl


    - name: Install ldid
      run: |
        git clone https://github.com/ProcursusTeam/ldid.git
        cd ldid
        make
        sudo cp ldid /usr/local/bin/ldid


    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos


    - name: Setup environment
      run: |
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH


    - name: Install iPhone SDK
      run: |
        mkdir -p $HOME/theos/sdks

        curl -L \
        https://github.com/theos/sdks/releases/download/master/iPhoneOS17.0.sdk.tar.xz \
        -o sdk.tar.xz

        tar xf sdk.tar.xz -C $HOME/theos/sdks


    - name: Build tweak
      run: |
        export THEOS=$HOME/theos

        make clean

        make FINALPACKAGE=1


    - name: Upload deb
      uses: actions/upload-artifact@v4

      with:
        name: SB-CPU-Floating

        path: packages/*.deb
