name: Build SB CPU Floating

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:

      # =========================
      # 1. 获取项目
      # =========================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================
      # 2. 安装编译工具
      # =========================
      - name: Install build tools
        shell: bash
        run: |
          set -e

          brew update

          brew install \
            make \
            dpkg \
            ldid \
            xz

          echo "===== Tool versions ====="

          clang --version
          make --version
          ldid -V || true
          dpkg --version


      # =========================
      # 3. 安装 RootHide Theos
      # =========================
      - name: Install RootHide Theos
        shell: bash
        run: |
          set -e

          export THEOS="$GITHUB_WORKSPACE/theos"

          echo "THEOS=$THEOS"

          rm -rf "$THEOS"

          git clone --recursive \
            https://github.com/roothide/theos.git \
            "$THEOS"

          echo "===== Theos installed ====="

          ls -lah "$THEOS"

          echo "===== Theos path ====="

          realpath "$THEOS"

          test -f "$THEOS/Makefile"

          echo "Theos OK"


      # =========================
      # 4. 安装 iPhoneOS 16.5 SDK
      # =========================
      - name: Install iPhoneOS SDK
        shell: bash
        run: |
          set -e

          export THEOS="$GITHUB_WORKSPACE/theos"

          mkdir -p "$THEOS/sdks"

          rm -f /tmp/iPhoneOS16.5.sdk.tar.xz

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz" \
            -o /tmp/iPhoneOS16.5.sdk.tar.xz

          echo "===== SDK archive ====="

          ls -lh /tmp/iPhoneOS16.5.sdk.tar.xz

          file /tmp/iPhoneOS16.5.sdk.tar.xz

          echo "===== Extract SDK ====="

          tar -xJf \
            /tmp/iPhoneOS16.5.sdk.tar.xz \
            -C "$THEOS/sdks"

          echo "===== Installed SDKs ====="

          find "$THEOS/sdks" \
            -maxdepth 1 \
            -type d \
            -name "*.sdk" \
            -print

          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "iPhoneOS16.5 SDK OK"


      # =========================
      # 5. 检查 Theos
      # =========================
      - name: Check Theos
        shell: bash
        run: |
          set -e

          export THEOS="$GITHUB_WORKSPACE/theos"

          echo "THEOS=$THEOS"

          test -f "$THEOS/Makefile"

          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "===== SDK ====="

          ls -lah "$THEOS/sdks/iPhoneOS16.5.sdk" | head -30

          echo "===== Theos ====="

          ls -lah "$THEOS/bin" | head -30

          echo "Theos check OK"


      # =========================
      # 6. 检查源代码
      # =========================
      - name: Check source files
        shell: bash
        run: |
          set -e

          echo "===== Repository ====="

          find . \
            -maxdepth 3 \
            -type f \
            -not -path "./.git/*" \
            -print

          echo "===== Makefile ====="

          cat Makefile

          echo "===== Source ====="

          find . \
            -maxdepth 3 \
            \( -name "*.xm" -o -name "*.mm" -o -name "*.m" \) \
            -print


      # =========================
      # 7. 编译 RootHide deb
      # =========================
      - name: Build RootHide deb
        shell: bash
        run: |
          set -e

          export THEOS="$GITHUB_WORKSPACE/theos"

          echo "===== Build environment ====="

          echo "THEOS=$THEOS"

          echo "SDK=$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "===== Clean ====="

          make clean || true

          echo "===== Build ====="

          make package \
            THEOS_PACKAGE_SCHEME=roothide \
            FINALPACKAGE=1 \
            ARCHS=arm64e \
            SDKVERSION=16.5


      # =========================
      # 8. 检查 deb
      # =========================
      - name: Check package
        shell: bash
        run: |
          set -e

          echo "===== packages ====="

          ls -lah packages

          echo "===== file ====="

          file packages/*.deb

          echo "===== dpkg ====="

          dpkg-deb -I packages/*.deb

          echo "===== Package contents ====="

          dpkg-deb -c packages/*.deb


      # =========================
      # 9. 上传 deb
      # =========================
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: SB-CPU-Floating-deb
          path: packages/*.deb
          if-no-files-found: error
