name: Build SB CPU Floating

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git \
          curl \
          make \
          clang \
          ldid \
          xz-utils \
          python3 \
          fakeroot \
          dpkg-dev


    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos


    - name: Install toolchain
      run: |
        mkdir -p $HOME/theos/toolchain/linux/iphone/bin

        wget -q https://github.com/theos/sdks/releases/download/master/iphoneos15.6.sdk.tar.xz \
        -O sdk.tar.xz

        mkdir -p $HOME/theos/sdks

        tar -xf sdk.tar.xz -C $HOME/theos/sdks


    - name: Setup
      run: |
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH


    - name: Build tweak
      run: |
        export THEOS=$HOME/theos
        make clean
        make package FINALPACKAGE=1


    - name: Upload deb
      uses: actions/upload-artifact@v4
      with:
        name: SB-CPU-Floating
        path: packages/*.deb
