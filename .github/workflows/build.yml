name: Build SBCPUFloating


on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:


    - name: Checkout source
      uses: actions/checkout@v4



    - name: Update system

      run: |

        sudo apt-get update

        sudo apt-get install -y \
          git \
          clang \
          make \
          xz-utils \
          fakeroot \
          dpkg-dev \
          perl \
          curl \
          python3 \
          build-essential



    - name: Install ldid

      run: |

        git clone https://github.com/ProcursusTeam/ldid.git ldid-source

        cd ldid-source

        make

        sudo cp ldid /usr/local/bin/ldid

        sudo chmod +x /usr/local/bin/ldid

        ldid --version || true



    - name: Install Theos

      run: |

        git clone --recursive https://github.com/theos/theos.git $HOME/theos

        echo "THEOS=$HOME/theos" >> $GITHUB_ENV



    - name: Install iOS SDK

      run: |

        mkdir -p $HOME/theos/sdks


        git clone --depth=1 https://github.com/xybp888/iOS-SDKs.git sdkrepo


        cp -r sdkrepo/*.sdk $HOME/theos/sdks/



    - name: Build tweak

      run: |

        export THEOS=$HOME/theos


        make clean || true


        make package FINALPACKAGE=1



    - name: Upload deb

      uses: actions/upload-artifact@v4

      with:

        name: SBCPUFloating-deb

        path: packages/*.deb
