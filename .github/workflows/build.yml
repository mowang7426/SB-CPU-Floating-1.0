name: Build SB CPU Floating

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          git \
          curl \
          wget \
          make \
          clang \
          llvm \
          ldid \
          libplist-dev \
          libplist-utils \
          libxml2-dev \
          libssl-dev \
          pkg-config \
          xz-utils


    - name: Install Theos
      run: |
        export THEOS=$HOME/theos

        git clone --recursive https://github.com/theos/theos.git $THEOS

        echo "THEOS=$THEOS" >> $GITHUB_ENV


    - name: Install iOS SDK
      run: |

        git clone https://github.com/theos/sdks.git

        mkdir -p $THEOS/sdks

        cp -r sdks/iPhoneOS*.sdk $THEOS/sdks/


    - name: Check environment
      run: |

        echo $THEOS

        ls $THEOS

        clang --version

        ldid -h || true


    - name: Build tweak
      run: |

        export THEOS=$HOME/theos

        make clean

        make FINALPACKAGE=1


    - name: Upload deb
      uses: actions/upload-artifact@v4

      with:

        name: SB-CPU-Floating-deb

        path: packages/*.deb
