name: Build SBCPUFloating

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt upgrade -y

        sudo apt install -y \
        git \
        clang \
        make \
        xz-utils \
        fakeroot \
        dpkg-dev \
        perl \
        curl \
        python3 \
        ldid


    - name: Install Theos
      run: |

        git clone --recursive https://github.com/theos/theos.git $HOME/theos

        echo "THEOS=$HOME/theos" >> $GITHUB_ENV


    - name: Install iPhoneOS SDK
      run: |

        git clone --depth=1 https://github.com/xybp888/iOS-SDKs.git

        mkdir -p $HOME/theos/sdks

        cp -r iOS-SDKs/*.sdk $HOME/theos/sdks/


    - name: Build package
      run: |

        export THEOS=$HOME/theos

        make clean

        make package FINALPACKAGE=1


    - name: Upload deb
      uses: actions/upload-artifact@v4

      with:

        name: SBCPUFloating-deb

        path: packages/*.deb
