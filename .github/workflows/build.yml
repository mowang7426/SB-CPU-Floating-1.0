name: Build Tweak

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang libssl-dev git

    - name: Setup Theos & Toolchain
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        curl -LO https://github.com/orion-developer/iOS-Toolchains/releases/download/Ubuntu-22.04/arm64-apple-darwin14.tar.xz
        mkdir -p $HOME/theos/toolchain/linux/iphone
        tar -xf arm64-apple-darwin14.tar.xz -C $HOME/theos/toolchain/linux/iphone

    - name: Build tweak
      run: |
        export THEOS=$HOME/theos
        make clean package FINALPACKAGE=1

    - name: Upload deb artifact
      uses: actions/upload-artifact@v4
      with:
        name: deb-package
        path: packages/*.deb
