name: Build RootHide deb

on:
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:


    - name: Checkout
      uses: actions/checkout@v4



    - name: Fix apt sources
      run: |

        sudo rm -rf /var/lib/apt/lists/*

        sudo apt clean

        sudo apt update



    - name: Install dependencies
      run: |

        sudo apt install -y \
          git \
          clang \
          make \
          curl \
          xz-utils \
          fakeroot \
          dpkg-dev \
          perl \
          python3



    - name: Install ldid
      run: |

        sudo curl -L \
        https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5/ldid_linux \
        -o /usr/local/bin/ldid

        sudo chmod +x /usr/local/bin/ldid

        ldid -h



    - name: Install Theos
      run: |

        export THEOS=$HOME/theos

        git clone --recursive \
        https://github.com/theos/theos.git \
        $THEOS


        echo "THEOS=$HOME/theos" >> $GITHUB_ENV


        $THEOS/bin/bootstrap.sh



    - name: Install SDK
      run: |

        mkdir -p $HOME/theos/sdks

        cd $HOME/theos/sdks


        git clone --depth=1 \
        https://github.com/theos/sdks.git sdk


        cp sdk/*.sdk .


        rm -rf sdk



    - name: Check files
      run: |

        ls -la

        find . -maxdepth 2 -type f



    - name: Build
      run: |

        export THEOS=$HOME/theos


        make clean

        make package FINALPACKAGE=1



    - name: Upload
      uses: actions/upload-artifact@v4

      with:

        name: SB-CPU-Floating

        path: packages/*.deb
