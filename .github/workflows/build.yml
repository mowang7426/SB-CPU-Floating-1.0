name: Build SB CPU Floating

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Update system
      run: |
        sudo apt update
        sudo apt install -y \
          git \
          curl \
          wget \
          make \
          perl \
          python3 \
          xz-utils \
          fakeroot \
          dpkg-dev \
          clang \
          ldid

    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos

    - name: Install iPhone SDK
      run: |
        bash $HOME/theos/install.sh

    - name: Setup environment
      run: |
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH

    - name: Build tweak
      run: |
        export THEOS=$HOME/theos
        make clean
        make package FINALPACKAGE=1

    - name: Upload deb
      uses: actions/upload-artifact@v4
      with:
        name: SB-CPU-Floating-deb
        path: packages/*.deb
