name: Build SB CPU Floating

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          git \
          make \
          clang \
          curl \
          wget \
          xz-utils \
          python3


    - name: Install ldid binary
      run: |
        wget https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5/ldid_linux_amd64

        chmod +x ldid_linux_amd64

        sudo mv ldid_linux_amd64 /usr/local/bin/ldid

        ldid -h


    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos


    - name: Setup Theos
      run: |
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV

        echo "$HOME/theos/bin" >> $GITHUB_PATH


    - name: Install iPhone SDK
      run: |
        mkdir -p $HOME/theos/sdks

        wget https://github.com/theos/sdks/releases/download/master/iPhoneOS17.0.sdk.tar.xz

        tar xf iPhoneOS17.0.sdk.tar.xz -C $HOME/theos/sdks


    - name: Build tweak
      run: |
        export THEOS=$HOME/theos

        make clean

        make FINALPACKAGE=1


    - name: Upload deb
      uses: actions/upload-artifact@v4

      with:
        name: SB-CPU-Floating

        path: packages/*.deb
