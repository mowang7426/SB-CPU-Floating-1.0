name: Build SB CPU Floating

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install packages
      run: |
        sudo apt update
        sudo apt install -y \
          git \
          curl \
          make \
          perl \
          python3 \
          xz-utils \
          fakeroot \
          dpkg-dev


    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos


    - name: Install iPhone toolchain
      run: |
        mkdir -p $HOME/theos/toolchain/linux/iphone/bin

        curl -L https://github.com/theos/sdks/releases/download/master/iphone-clang.tar.xz \
        -o clang.tar.xz

        tar xf clang.tar.xz -C $HOME/theos/toolchain/linux/iphone


    - name: Environment
      run: |
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH


    - name: Check toolchain
      run: |
        ls -la $HOME/theos/toolchain/linux/iphone/bin


    - name: Build tweak
      run: |
        export THEOS=$HOME/theos
        make clean
        make package FINALPACKAGE=1


    - name: Upload deb
      uses: actions/upload-artifact@v4
      with:
        name: SB-CPU-Floating-deb
        path: packages/*.deb
