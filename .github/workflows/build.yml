name: Build SB CPU Floating

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          git \
          curl \
          wget \
          make \
          clang \
          llvm \
          libplist-dev \
          libplist-utils \
          libxml2-dev \
          libssl-dev \
          pkg-config \
          xz-utils


    - name: Install ldid
      run: |
        git clone https://github.com/ProcursusTeam/ldid.git

        cd ldid

        make

        sudo cp ldid /usr/local/bin/ldid

        sudo chmod +x /usr/local/bin/ldid

        ldid -h || true


    - name: Install Theos
      run: |

        git clone --recursive \
        https://github.com/theos/theos.git \
        $HOME/theos

        echo "THEOS=$HOME/theos" >> $GITHUB_ENV


    - name: Install iOS SDK
      run: |

        git clone https://github.com/theos/sdks.git

        mkdir -p $THEOS/sdks

        cp -r sdks/iPhoneOS*.sdk $THEOS/sdks/


    - name: Check environment
      run: |

        echo $THEOS

        clang --version

        ldid -h || true


    - name: Build tweak
      run: |

        export THEOS=$HOME/theos

        export THEOS_PACKAGE_SCHEME=rootless

        make clean

        make FINALPACKAGE=1


    - name: Upload deb
      uses: actions/upload-artifact@v4

      with:

        name: SB-CPU-Floating-deb

        path: packages/*.deb
