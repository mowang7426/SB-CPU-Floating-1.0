name: Build RootHide deb

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive


    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git \
          clang \
          make \
          xz-utils \
          ldid \
          fakeroot \
          dpkg-dev


    - name: Install Theos
      run: |
        export THEOS=$HOME/theos

        rm -rf $THEOS

        git clone --recursive https://github.com/theos/theos.git $THEOS

        echo "THEOS=$HOME/theos" >> $GITHUB_ENV

        chmod +x $THEOS/bin/bootstrap.sh

        $THEOS/bin/bootstrap.sh


    - name: Install iPhoneOS SDK
      run: |

        mkdir -p $HOME/theos/sdks

        cd $HOME/theos/sdks

        if [ ! -d "iPhoneOS16.5.sdk" ]; then

          git clone --depth=1 \
          https://github.com/theos/sdks.git sdkrepo

          cp -r sdkrepo/*.sdk .

          rm -rf sdkrepo

        fi


    - name: Check project files
      run: |

        echo "===== Files ====="

        ls -la

        echo "===== Theos ====="

        ls $THEOS


    - name: Build package
      run: |

        export THEOS=$HOME/theos

        make clean

        make package FINALPACKAGE=1


    - name: Upload deb
      uses: actions/upload-artifact@v4
      with:

        name: SB-CPU-Floating-deb

        path: |
          packages/*.deb
