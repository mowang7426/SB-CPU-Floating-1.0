name: Build SB CPU Floating

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git \
          curl \
          xz-utils \
          ldid \
          make \
          clang \
          libplist-dev \
          libxml2-dev


    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV


    - name: Install iPhone SDK
      run: |
        mkdir -p $HOME/theos/sdks

        curl -L \
        https://github.com/theos/sdks/releases/download/master/iPhoneOS16.5.sdk.tar.xz \
        -o sdk.tar.xz

        tar -xf sdk.tar.xz \
        -C $HOME/theos/sdks


    - name: Setup toolchain
      run: |
        export THEOS=$HOME/theos

        mkdir -p $THEOS/toolchain/linux/iphone/bin

        ln -sf $(which clang) \
        $THEOS/toolchain/linux/iphone/bin/clang

        ln -sf $(which clang++) \
        $THEOS/toolchain/linux/iphone/bin/clang++


    - name: Check environment
      run: |
        export THEOS=$HOME/theos
        clang --version
        ls $THEOS/sdks


    - name: Build tweak
      run: |
        export THEOS=$HOME/theos
        make clean
        make package FINALPACKAGE=1


    - name: Upload deb
      uses: actions/upload-artifact@v4
      with:
        name: SB-CPU-Floating-deb
        path: packages/*.deb
